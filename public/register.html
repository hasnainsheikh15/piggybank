<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="register.css">
  <script src="toast.js"></script>
  <title>PiggyBank - Register</title>
</head>

<body>
  <div class="container">
    <!-- Logo -->
    <div class="logo">
      <div class="logo-icon">
        <svg class="pig-icon" width="40" height="40" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <!-- Main body gradient -->
            <linearGradient id="pigBodyGradient" x1="10" y1="15" x2="70" y2="65" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#fef9c3" />
              <stop offset="0.3" stop-color="#facc15" />
              <stop offset="1" stop-color="#ca8a04" />
            </linearGradient>

            <!-- Belly / underside gradient -->
            <linearGradient id="pigBellyGradient" x1="20" y1="40" x2="60" y2="70" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#eab308" />
              <stop offset="1" stop-color="#854d0e" />
            </linearGradient>

            <!-- Snout gradient -->
            <linearGradient id="pigSnoutGradient" x1="30" y1="45" x2="50" y2="60" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#fef3c7" />
              <stop offset="1" stop-color="#facc15" />
            </linearGradient>

            <!-- Leg gradient -->
            <linearGradient id="pigLegGradient" x1="0" y1="0" x2="0" y2="10" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#facc15" />
              <stop offset="1" stop-color="#854d0e" />
            </linearGradient>

            <!-- Coin gradient -->
            <linearGradient id="coinGradient" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#fef9c3" />
              <stop offset="0.4" stop-color="#facc15" />
              <stop offset="1" stop-color="#b45309" />
            </linearGradient>

            <!-- Soft drop shadow -->
            <filter id="pigShadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="black" flood-opacity="0.45" />
            </filter>

            <!-- Eye shine gradient -->
            <radialGradient id="eyeHighlight" cx="0.3" cy="0.3" r="0.7">
              <stop offset="0" stop-color="#ffffff" stop-opacity="0.9" />
              <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
            </radialGradient>
          </defs>

          <!-- Ground shadow ellipse -->
          <ellipse cx="40" cy="64" rx="22" ry="6" fill="black" opacity="0.25" />

          <!-- Pig body group with shadow -->
          <g filter="url(#pigShadow)">
            <!-- Main body -->
            <ellipse cx="40" cy="40" rx="22" ry="17" fill="url(#pigBodyGradient)" />

            <!-- Belly shading -->
            <ellipse cx="40" cy="44" rx="18" ry="12" fill="url(#pigBellyGradient)" opacity="0.55" />

            <!-- Left ear -->
            <path d="M26 20 C24 16, 26 12, 30 13 C34 14, 35 18, 33 21 Z" fill="#facc15" stroke="#854d0e"
              stroke-width="0.7" />
            <!-- Right ear -->
            <path d="M54 20 C56 16, 54 12, 50 13 C46 14, 45 18, 47 21 Z" fill="#facc15" stroke="#854d0e"
              stroke-width="0.7" />

            <!-- Left cheek bulge -->
            <ellipse cx="22" cy="38" rx="6" ry="8" fill="#facc15" />
            <!-- Right cheek bulge -->
            <ellipse cx="58" cy="38" rx="6" ry="8" fill="#facc15" />

            <!-- Snout -->
            <ellipse cx="40" cy="47" rx="10" ry="7" fill="url(#pigSnoutGradient)" stroke="#854d0e" stroke-width="0.8" />
            <!-- Nostrils -->
            <circle cx="36.5" cy="47" r="1.4" fill="#1a1a1a" opacity="0.85" />
            <circle cx="43.5" cy="47" r="1.4" fill="#1a1a1a" opacity="0.85" />

            <!-- Eye -->
            <circle cx="31" cy="36" r="3.2" fill="#111111" />
            <!-- Eye highlight -->
            <circle cx="30.3" cy="35.3" r="1.3" fill="url(#eyeHighlight)" />

            <!-- Smile / mouth -->
            <path d="M34 51 C37 54, 43 54, 46 51" fill="none" stroke="#1a1a1a" stroke-width="1.2"
              stroke-linecap="round" />

            <!-- Back slot for coins -->
            <rect x="32" y="25" width="16" height="3" rx="1.5" fill="#111827" opacity="0.9" />
            <!-- Highlight on slot -->
            <rect x="33" y="25.3" width="6" height="1.2" rx="0.6" fill="#fef9c3" opacity="0.4" />

            <!-- Front leg -->
            <rect x="29" y="51" width="6" height="9" rx="2" fill="url(#pigLegGradient)" />
            <!-- Back leg -->
            <rect x="45" y="51" width="6" height="9" rx="2" fill="url(#pigLegGradient)" />

            <!-- Tiny highlight on body (top left) -->
            <ellipse cx="32" cy="32" rx="10" ry="7" fill="#fef9c3" opacity="0.22" />
          </g>

          <!-- Coins coming out of slot -->
          <g>
            <!-- Coin 1 -->
            <circle cx="52" cy="18" r="5" fill="url(#coinGradient)" />
            <circle cx="52" cy="18" r="5" fill="none" stroke="#fef9c3" stroke-width="0.5" opacity="0.5" />
            <!-- Coin 2 -->
            <circle cx="46" cy="10" r="4" fill="url(#coinGradient)" opacity="0.9" />
            <!-- Coin 3 (behind) -->
            <circle cx="57" cy="11" r="3.5" fill="url(#coinGradient)" opacity="0.7" />
          </g>
        </svg>

      </div>
      <span class="logo-text">PiggyBank</span>
    </div>

    <!-- Registration Card -->
    <div class="card">
      <form class="form">
        <!-- Full Name -->
        <div class="input-wrapper">
          <input type="text" class="input" placeholder="Full Name" required>
        </div>

        <!-- Email -->
        <div class="input-wrapper">
          <input type="email" class="input" placeholder="Email Address" required>
        </div>

        <!-- Phone -->
        <div class="input-wrapper">
          <input type="tel" class="input" placeholder="Phone Number" required>
        </div>

        <!-- Date of Birth -->
        <div class="input-wrapper">
          <input type="date" class="input" placeholder="Date of Birth" required>
          <span class="date-icon">📅</span>
        </div>

        <!-- Password -->
        <div class="input-wrapper">
          <input type="password" class="input" placeholder="Password" required>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn">Send OTP</button>
      </form>
    </div>
  </div>
  <script>
    const token = localStorage.getItem("accessToken");

    if (token) {
      window.location.href = "/dashboard.html";
    }
    document.querySelector(".form").addEventListener("submit", async function (e) {
      e.preventDefault();

      const name = document.querySelector('input[placeholder="Full Name"]').value.trim();
      const email = document.querySelector('input[placeholder="Email Address"]').value.trim();
      const phone = document.querySelector('input[placeholder="Phone Number"]').value.trim();
      const dob = document.querySelector('input[type="date"]').value;
      const password = document.querySelector('input[placeholder="Password"]').value;

      const btn = document.querySelector(".btn");
      btn.disabled = true;
      btn.textContent = "Sending...";

      try {
        const res = await fetch("http://localhost:3000/api/v1/pb/users/send-signup-otp", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ name, email, phone, dob, password })
        });

        const data = await res.json();

        if (!res.ok) {
          alert(data.message || "Something went wrong");
          btn.disabled = false;
          btn.textContent = "Send OTP";
          return;
        }

        alert("OTP sent successfully!");
        // redirect to OTP page (create otp.html)
        window.location.href = `/verifyotp.html?email=${email}`;

      } catch (error) {
        console.error(error);
        alert("Network error");
      }

      btn.disabled = false;
      btn.textContent = "Send OTP";
    });
  </script>

</body>

</html>
