<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PiggyBank - Verify OTP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0a0a0a;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
        }

        /* Logo Section */
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #e647ce, #eab308);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 0 24px rgba(250, 204, 21, 0.3);
        }

        .logo-text {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        /* Card */
        .card {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 24px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow:
                0 24px 48px rgba(0, 0, 0, 0.4),
                0 0 60px rgba(250, 204, 21, 0.15);
            border-color: rgba(250, 204, 21, 0.2);
        }

        /* Form */
        .form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        /* Title */
        .form-title {
            color: #ffffff;
            font-size: 22px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 4px;
        }

        /* Email Display */
        .email-display {
            color: #b5b5b5;
            font-size: 14px;
            text-align: center;
            margin-bottom: 8px;
        }

        .email-display strong {
            color: #facc15;
            font-weight: 500;
        }

        /* OTP Input Container */
        .otp-container {
            display: flex;
            gap: 12px;
            justify-content: center;
            width: 100%;
        }

        .otp-input {
            width: 48px;
            height: 56px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #ffffff;
            font-size: 24px;
            font-weight: 600;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
            caret-color: #facc15;
        }

        .otp-input::placeholder {
            color: #4a4a4a;
        }

        .otp-input:focus {
            border-color: rgba(250, 204, 21, 0.5);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 0 4px rgba(250, 204, 21, 0.1), 0 0 20px rgba(250, 204, 21, 0.15);
        }

        /* Resend Link */
        .resend-link {
            color: #b5b5b5;
            font-size: 14px;
            text-align: center;
        }

        .resend-btn {
            color: #facc15;
            background: none;
            border: none;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .resend-btn:hover {
            color: #eab308;
            text-decoration: underline;
        }

        .resend-btn:disabled {
            color: #666;
            cursor: not-allowed;
        }

        /* Button */
        .btn {
            width: 100%;
            padding: 18px 24px;
            margin-top: 12px;
            background: transparent;
            border: 2px solid #facc15;
            border-radius: 14px;
            color: #facc15;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #facc15, #eab308);
            z-index: -1;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .btn:hover:not(:disabled) {
            color: #0a0a0a;
            transform: translateY(-4px);
            box-shadow:
                0 12px 32px rgba(250, 204, 21, 0.35),
                0 0 40px rgba(250, 204, 21, 0.2);
        }

        .btn:hover:not(:disabled)::before {
            opacity: 1;
        }

        .btn:active:not(:disabled) {
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Success Card */
        .success-card {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            text-align: center;
        }

        .success-card.active {
            display: flex;
        }

        .form-card.hidden {
            display: none;
        }

        /* Checkmark Circle */
        .checkmark-circle {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #facc15, #eab308);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow:
                0 0 40px rgba(250, 204, 21, 0.4),
                0 0 80px rgba(250, 204, 21, 0.2);
            animation: pulse-glow 2s ease-in-out infinite;
        }

        @keyframes pulse-glow {

            0%,
            100% {
                box-shadow:
                    0 0 40px rgba(250, 204, 21, 0.4),
                    0 0 80px rgba(250, 204, 21, 0.2);
            }

            50% {
                box-shadow:
                    0 0 60px rgba(250, 204, 21, 0.5),
                    0 0 100px rgba(250, 204, 21, 0.3);
            }
        }

        .checkmark-icon {
            font-size: 48px;
            animation: scale-in 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes scale-in {
            0% {
                transform: scale(0);
                opacity: 0;
            }

            50% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .success-title {
            color: #ffffff;
            font-size: 24px;
            font-weight: 600;
        }

        .success-text {
            color: #b5b5b5;
            font-size: 15px;
            line-height: 1.5;
        }

        /* Error Message */
        .error-message {
            display: none;
            color: #ef4444;
            font-size: 14px;
            text-align: center;
            padding: 12px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 10px;
            width: 100%;
        }

        .error-message.active {
            display: block;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container {
                gap: 24px;
            }

            .logo-icon {
                width: 40px;
                height: 40px;
                font-size: 20px;
            }

            .logo-text {
                font-size: 24px;
            }

            .card {
                padding: 32px 20px;
                border-radius: 20px;
            }

            .otp-input {
                width: 42px;
                height: 50px;
                font-size: 20px;
            }

            .otp-container {
                gap: 8px;
            }

            .btn {
                padding: 16px 20px;
                font-size: 15px;
            }

            .checkmark-circle {
                width: 80px;
                height: 80px;
            }

            .checkmark-icon {
                font-size: 40px;
            }

            .success-title {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Logo -->
        <div class="logo">
            <div class="logo-icon">
                <svg class="pig-icon" width="40" height="40" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <!-- Main body gradient -->
                        <linearGradient id="pigBodyGradient" x1="10" y1="15" x2="70" y2="65"
                            gradientUnits="userSpaceOnUse">
                            <stop offset="0" stop-color="#fef9c3" />
                            <stop offset="0.3" stop-color="#facc15" />
                            <stop offset="1" stop-color="#ca8a04" />
                        </linearGradient>

                        <!-- Belly / underside gradient -->
                        <linearGradient id="pigBellyGradient" x1="20" y1="40" x2="60" y2="70"
                            gradientUnits="userSpaceOnUse">
                            <stop offset="0" stop-color="#eab308" />
                            <stop offset="1" stop-color="#854d0e" />
                        </linearGradient>

                        <!-- Snout gradient -->
                        <linearGradient id="pigSnoutGradient" x1="30" y1="45" x2="50" y2="60"
                            gradientUnits="userSpaceOnUse">
                            <stop offset="0" stop-color="#fef3c7" />
                            <stop offset="1" stop-color="#facc15" />
                        </linearGradient>

                        <!-- Leg gradient -->
                        <linearGradient id="pigLegGradient" x1="0" y1="0" x2="0" y2="10" gradientUnits="userSpaceOnUse">
                            <stop offset="0" stop-color="#facc15" />
                            <stop offset="1" stop-color="#854d0e" />
                        </linearGradient>

                        <!-- Coin gradient -->
                        <linearGradient id="coinGradient" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0" stop-color="#fef9c3" />
                            <stop offset="0.4" stop-color="#facc15" />
                            <stop offset="1" stop-color="#b45309" />
                        </linearGradient>

                        <!-- Soft drop shadow -->
                        <filter id="pigShadow" x="-20%" y="-20%" width="140%" height="140%">
                            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="black" flood-opacity="0.45" />
                        </filter>

                        <!-- Eye shine gradient -->
                        <radialGradient id="eyeHighlight" cx="0.3" cy="0.3" r="0.7">
                            <stop offset="0" stop-color="#ffffff" stop-opacity="0.9" />
                            <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
                        </radialGradient>
                    </defs>

                    <!-- Ground shadow ellipse -->
                    <ellipse cx="40" cy="64" rx="22" ry="6" fill="black" opacity="0.25" />

                    <!-- Pig body group with shadow -->
                    <g filter="url(#pigShadow)">
                        <!-- Main body -->
                        <ellipse cx="40" cy="40" rx="22" ry="17" fill="url(#pigBodyGradient)" />

                        <!-- Belly shading -->
                        <ellipse cx="40" cy="44" rx="18" ry="12" fill="url(#pigBellyGradient)" opacity="0.55" />

                        <!-- Left ear -->
                        <path d="M26 20 C24 16, 26 12, 30 13 C34 14, 35 18, 33 21 Z" fill="#facc15" stroke="#854d0e"
                            stroke-width="0.7" />
                        <!-- Right ear -->
                        <path d="M54 20 C56 16, 54 12, 50 13 C46 14, 45 18, 47 21 Z" fill="#facc15" stroke="#854d0e"
                            stroke-width="0.7" />

                        <!-- Left cheek bulge -->
                        <ellipse cx="22" cy="38" rx="6" ry="8" fill="#facc15" />
                        <!-- Right cheek bulge -->
                        <ellipse cx="58" cy="38" rx="6" ry="8" fill="#facc15" />

                        <!-- Snout -->
                        <ellipse cx="40" cy="47" rx="10" ry="7" fill="url(#pigSnoutGradient)" stroke="#854d0e"
                            stroke-width="0.8" />
                        <!-- Nostrils -->
                        <circle cx="36.5" cy="47" r="1.4" fill="#1a1a1a" opacity="0.85" />
                        <circle cx="43.5" cy="47" r="1.4" fill="#1a1a1a" opacity="0.85" />

                        <!-- Eye -->
                        <circle cx="31" cy="36" r="3.2" fill="#111111" />
                        <!-- Eye highlight -->
                        <circle cx="30.3" cy="35.3" r="1.3" fill="url(#eyeHighlight)" />

                        <!-- Smile / mouth -->
                        <path d="M34 51 C37 54, 43 54, 46 51" fill="none" stroke="#1a1a1a" stroke-width="1.2"
                            stroke-linecap="round" />

                        <!-- Back slot for coins -->
                        <rect x="32" y="25" width="16" height="3" rx="1.5" fill="#111827" opacity="0.9" />
                        <!-- Highlight on slot -->
                        <rect x="33" y="25.3" width="6" height="1.2" rx="0.6" fill="#fef9c3" opacity="0.4" />

                        <!-- Front leg -->
                        <rect x="29" y="51" width="6" height="9" rx="2" fill="url(#pigLegGradient)" />
                        <!-- Back leg -->
                        <rect x="45" y="51" width="6" height="9" rx="2" fill="url(#pigLegGradient)" />

                        <!-- Tiny highlight on body (top left) -->
                        <ellipse cx="32" cy="32" rx="10" ry="7" fill="#fef9c3" opacity="0.22" />
                    </g>

                    <!-- Coins coming out of slot -->
                    <g>
                        <!-- Coin 1 -->
                        <circle cx="52" cy="18" r="5" fill="url(#coinGradient)" />
                        <circle cx="52" cy="18" r="5" fill="none" stroke="#fef9c3" stroke-width="0.5" opacity="0.5" />
                        <!-- Coin 2 -->
                        <circle cx="46" cy="10" r="4" fill="url(#coinGradient)" opacity="0.9" />
                        <!-- Coin 3 (behind) -->
                        <circle cx="57" cy="11" r="3.5" fill="url(#coinGradient)" opacity="0.7" />
                    </g>
                </svg>

            </div>
            <span class="logo-text">PiggyBank</span>
        </div>

        <!-- OTP Verification Card -->
        <div class="card">
            <!-- Form Card -->
            <div class="form-card" id="formCard">
                <form class="form" id="otpForm">
                    <h2 class="form-title">Verify Your Email</h2>
                    <p class="email-display">OTP sent to: <strong id="emailDisplay">user@example.com</strong></p>

                    <!-- Error Message -->
                    <div class="error-message" id="errorMessage"></div>

                    <!-- OTP Input -->
                    <div class="otp-container">
                        <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]"
                            autofocus>
                        <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]">
                        <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]">
                        <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]">
                        <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]">
                        <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]">
                    </div>

                    <!-- Resend Link -->
                    <p class="resend-link">
                        Didn't receive the code?
                        <button type="button" class="resend-btn" id="resendBtn">Resend OTP</button>
                    </p>

                    <!-- Submit Button -->
                    <button type="submit" class="btn" id="verifyBtn">Verify OTP</button>
                </form>
            </div>

            <!-- Success Card -->
            <div class="success-card" id="successCard">
                <div class="checkmark-circle">
                    <span class="checkmark-icon">✓</span>
                </div>
                <h2 class="success-title">Account Created Successfully</h2>
                <p class="success-text">Your email has been verified. You can now log in to your account.</p>
                <button class="btn" onclick="window.location.href='/login.html'">Continue to Login</button>
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const otpInputs = document.querySelectorAll('.otp-input');
        const otpForm = document.getElementById('otpForm');
        const formCard = document.getElementById('formCard');
        const successCard = document.getElementById('successCard');
        const verifyBtn = document.getElementById('verifyBtn');
        const resendBtn = document.getElementById('resendBtn');
        const emailDisplay = document.getElementById('emailDisplay');
        const errorMessage = document.getElementById('errorMessage');

        // Get email from URL params
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email');

        // Validate email presence
        if (!email) {
            showError('Email parameter is missing. Please go back and try again.');
            verifyBtn.disabled = true;
            resendBtn.disabled = true;
        } else {
            emailDisplay.textContent = email;
        }

        // OTP Input handling - auto-focus next input
        otpInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                const value = e.target.value;

                // Only allow numbers
                if (!/^\d*$/.test(value)) {
                    e.target.value = '';
                    return;
                }

                // Move to next input
                if (value && index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                // Handle backspace - move to previous input
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    otpInputs[index - 1].focus();
                }
            });

            // Handle paste
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pastedData = e.clipboardData.getData('text').replace(/\D/g, '').slice(0, 6);

                pastedData.split('').forEach((char, i) => {
                    if (otpInputs[i]) {
                        otpInputs[i].value = char;
                    }
                });

                // Focus last filled input or first empty one
                const lastFilledIndex = Math.min(pastedData.length - 1, otpInputs.length - 1);
                if (pastedData.length < 6) {
                    otpInputs[pastedData.length]?.focus();
                } else {
                    otpInputs[lastFilledIndex].focus();
                }
            });
        });

        // Get OTP value
        function getOtpValue() {
            return Array.from(otpInputs).map(input => input.value).join('');
        }

        // Show error message
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('active');
        }

        // Hide error message
        function hideError() {
            errorMessage.classList.remove('active');
        }

        // Verify OTP
        otpForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();

            const otp = getOtpValue();

            if (otp.length !== 6) {
                showError('Please enter a valid 6-digit OTP');
                return;
            }

            // Set loading state
            verifyBtn.disabled = true;
            verifyBtn.textContent = 'Verifying…';

            try {
                const response = await fetch('http://localhost:3000/api/v1/pb/users/verify-otp', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email,
                        otp: otp
                    })
                });

                const data = await response.json();
                
                if (response.ok) {

                    const {user,accessToken} = data.data;

                    localStorage.setItem('accessToken',accessToken);
                    localStorage.setItem('user',JSON.stringify(user));

                    // Show success card
                    formCard.classList.add('hidden');
                    successCard.classList.add('active');

                    
                    //redirect to user dashboard 
                    setTimeout(() => {
                        window.location.href = `/dashboard.html`;
                    }, 2500);
                } else {
                    showError(data.message || 'Verification failed. Please try again.');
                    verifyBtn.disabled = false;
                    verifyBtn.textContent = 'Verify OTP';
                }
            } catch (error) {
                showError('Network error or OTP is expired or wrong OTP');
                verifyBtn.disabled = false;
                verifyBtn.textContent = 'Verify OTP';
            }
        });

        // Resend OTP
        resendBtn.addEventListener('click', async () => {
            hideError();
            resendBtn.disabled = true;
            resendBtn.textContent = 'Sending…';

            try {
                const response = await fetch('http://localhost:3000/api/v1/pb/users/resend-otp', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    resendBtn.textContent = 'OTP Sent!';
                    setTimeout(() => {
                        resendBtn.textContent = 'Resend OTP';
                        resendBtn.disabled = false;
                    }, 3000);
                } else {
                    showError(data.message || 'Failed to resend OTP. Please try again.');
                    resendBtn.textContent = 'Resend OTP';
                    resendBtn.disabled = false;
                }
            } catch (error) {
                showError('Network error. Please check your connection and try again.');
                resendBtn.textContent = 'Resend OTP';
                resendBtn.disabled = false;
            }
        });

    </script>
</body>

</html>
